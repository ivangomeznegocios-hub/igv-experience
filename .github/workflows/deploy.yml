name: Pruebas y despliegue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @igv/web build

  deploy:
    name: Desplegar en Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verificar el secreto
        env:
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::error::Falta el secreto CLOUDFLARE_API_TOKEN en GitHub (Settings → Secrets and variables → Actions)"; exit 1; fi
          # Opcional: solo hace falta si tu token tiene acceso a más de una cuenta de Cloudflare.
          if [ -n "$ACCOUNT_ID" ]; then echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"; fi
      - name: Crear (si no existe) y configurar la base de datos D1
        working-directory: apps/api
        run: |
          ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(x=>x.name==="igv-experience");process.stdout.write(db?db.uuid:"")})')
          if [ -z "$ID" ]; then
            echo "Creando la base de datos igv-experience…"
            npx wrangler d1 create igv-experience
            ID=$(npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const db=JSON.parse(s).find(x=>x.name==="igv-experience");process.stdout.write(db?db.uuid:"")})')
          fi
          if [ -z "$ID" ]; then echo "::error::No se pudo obtener el ID de la base de datos D1"; exit 1; fi
          echo "Base de datos: $ID"
          # La app y el servidor MCP usan la misma base.
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc wrangler.mcp.jsonc
      - run: pnpm --filter @igv/web build
      - name: Aplicar migraciones de D1
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote
      - name: Desplegar Worker (app y API)
        working-directory: apps/api
        run: npx wrangler deploy
      - name: Desplegar servidor MCP (Conectar IA)
        working-directory: apps/api
        run: npx wrangler deploy -c wrangler.mcp.jsonc
